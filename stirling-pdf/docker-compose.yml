services:
  stirling-pdf:
    # Pinned to a specific release for reproducible deployments.
    # Check https://github.com/Stirling-Tools/Stirling-PDF/releases for newer tags.
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.2
    container_name: stirling-pdf
    restart: unless-stopped
    # Not published to the host — traffic reaches Stirling-PDF only through the
    # Caddy reverse proxy below. To also expose it directly (e.g. for debugging),
    # add:  ports: ["8080:8080"]
    expose:
      - "8080"
    volumes:
      # OCR language data (Tesseract) — add .traineddata files here for extra languages
      - ./data/tessdata:/usr/share/tessdata
      # Custom application configuration (settings.yml, custom_settings.yml)
      - ./data/configs:/configs
      # Custom UI / branding assets
      - ./data/customFiles:/customFiles
      # Persisted application logs
      - ./data/logs:/logs
      # Pipeline definitions for automated PDF workflows
      - ./data/pipeline:/pipeline
    environment:
      # Additional features (incl. the security/login module) must be enabled
      # for authentication to work. Keep "false" here since we need login.
      DISABLE_ADDITIONAL_FEATURES: "false"
      # Enable the security module in the Docker image (required for login).
      DOCKER_ENABLE_SECURITY: "true"
      # --- Authentication / login ---
      # Require users to log in before using the app.
      SECURITY_ENABLELOGIN: "true"
      # Initial admin account, created on first startup only. Set these in a
      # .env file (see .env.example) BEFORE the very first `docker compose up`.
      # If left unset, Stirling-PDF falls back to admin / stirling.
      SECURITY_INITIALLOGIN_USERNAME: "${STIRLING_ADMIN_USERNAME:-admin}"
      SECURITY_INITIALLOGIN_PASSWORD: "${STIRLING_ADMIN_PASSWORD:-stirling}"
      # Lock an account after this many failed attempts...
      SECURITY_LOGINATTEMPTCOUNT: "5"
      # ...for this many minutes.
      SECURITY_LOGINRESETTIMEMINUTES: "120"
      # Default UI locale
      SYSTEM_DEFAULTLOCALE: "en-US"
      # Expose Prometheus-style metrics at /actuator/prometheus
      SYSTEM_ENABLEANALYTICS: "false"
      # Branding shown in the UI
      UI_APPNAME: "Stirling-PDF"
      UI_APPNAMENAVBAR: "Stirling-PDF"
      UI_HOMEDESCRIPTION: "Your locally hosted PDF toolkit."
      # Maximum upload size
      SYSTEM_MAXFILESIZE: "100"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/info/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - stirling-network

  # Reverse proxy terminating HTTPS in front of Stirling-PDF.
  # - STIRLING_DOMAIN=localhost (default): Caddy serves HTTPS with its own
  #   internal CA — trusted on the host once you run the caddy-trust helper
  #   (see README), otherwise the browser shows a one-time warning.
  # - STIRLING_DOMAIN=your.public.domain: Caddy automatically obtains and
  #   renews a Let's Encrypt certificate (ports 80 and 443 must be reachable).
  caddy:
    image: caddy:2-alpine
    container_name: stirling-caddy
    restart: unless-stopped
    depends_on:
      stirling-pdf:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      STIRLING_DOMAIN: "${STIRLING_DOMAIN:-localhost}"
    # HTTP Basic Auth credentials for the proxy. Loaded from proxy-auth.env
    # (see proxy-auth.env.example) — passed literally, so the bcrypt hash's
    # `$` characters need no escaping. required: false lets the stack start
    # with the built-in default (admin / changeme) until you create the file.
    env_file:
      - path: ./proxy-auth.env
        required: false
    volumes:
      # Reverse-proxy configuration
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certificates and ACME account data across restarts
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - stirling-network

networks:
  stirling-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
