services:
  stirling-pdf:
    # Pinned to a specific release for reproducible deployments.
    # Check https://github.com/Stirling-Tools/Stirling-PDF/releases for newer tags.
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.2
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # OCR language data (Tesseract) — add .traineddata files here for extra languages
      - ./data/tessdata:/usr/share/tessdata
      # Custom application configuration (settings.yml, custom_settings.yml)
      - ./data/configs:/configs
      # Custom UI / branding assets
      - ./data/customFiles:/customFiles
      # Persisted application logs
      - ./data/logs:/logs
      # Pipeline definitions for automated PDF workflows
      - ./data/pipeline:/pipeline
    environment:
      # Additional features (incl. the security/login module) must be enabled
      # for authentication to work. Keep "false" here since we need login.
      DISABLE_ADDITIONAL_FEATURES: "false"
      # Enable the security module in the Docker image (required for login).
      DOCKER_ENABLE_SECURITY: "true"
      # --- Authentication / login ---
      # Require users to log in before using the app.
      SECURITY_ENABLELOGIN: "true"
      # Initial admin account, created on first startup only. Set these in a
      # .env file (see .env.example) BEFORE the very first `docker compose up`.
      # If left unset, Stirling-PDF falls back to admin / stirling.
      SECURITY_INITIALLOGIN_USERNAME: "${STIRLING_ADMIN_USERNAME:-admin}"
      SECURITY_INITIALLOGIN_PASSWORD: "${STIRLING_ADMIN_PASSWORD:-stirling}"
      # Lock an account after this many failed attempts...
      SECURITY_LOGINATTEMPTCOUNT: "5"
      # ...for this many minutes.
      SECURITY_LOGINRESETTIMEMINUTES: "120"
      # Default UI locale
      SYSTEM_DEFAULTLOCALE: "en-US"
      # Expose Prometheus-style metrics at /actuator/prometheus
      SYSTEM_ENABLEANALYTICS: "false"
      # Branding shown in the UI
      UI_APPNAME: "Stirling-PDF"
      UI_APPNAMENAVBAR: "Stirling-PDF"
      UI_HOMEDESCRIPTION: "Your locally hosted PDF toolkit."
      # Maximum upload size
      SYSTEM_MAXFILESIZE: "100"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/info/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - stirling-network

networks:
  stirling-network:
    driver: bridge
